name: Bug 报告

description: 报告一个缺陷以帮助我们改进

title: "[Bug]: "

labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量提供充分信息以便复现。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述你遇到的问题。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 请提供可复现的步骤。
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 使用的 DeepSeek Harness 版本。

  - type: input
    id: platform
    attributes:
      label: 平台 / 浏览器
      description: 操作系统与浏览器版本。

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 相关报错日志（请脱敏）。